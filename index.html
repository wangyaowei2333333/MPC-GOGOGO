<!doctype html>
<html lang="zh-CN" data-phase="intro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0F" />
    <meta name="color-scheme" content="dark" />

    <title>MPC · MINI PC CLUB — 极客组装成品电脑</title>
    <meta
      name="description"
      content="MPC（MINI PC CLUB）极客组装成品电脑。3D 装机预览、配件兼容性校验、整机实测数据，一台一台手工组装。"
    />
    <meta name="keywords" content="MPC,MINI PC CLUB,组装电脑,成品主机,小机箱,ITX,装机配置,极客电脑" />
    <meta name="author" content="MPC" />

    <!--
      __SITE_URL__ 由 vite.config.ts 的 mpc:site-url 插件在构建时替换，
      按 VITE_SITE_URL → Vercel 生产域名 → Cloudflare Pages 域名 → GitHub Pages
      的顺序取值。三处部署共用同一份源码，不要在这里写死域名。
    -->
    <link rel="canonical" href="__SITE_URL__" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MPC · MINI PC CLUB" />
    <meta property="og:title" content="MPC · MINI PC CLUB — 极客组装成品电脑" />
    <meta
      property="og:description"
      content="3D 装机预览、配件兼容性校验、整机实测数据。"
    />
    <!-- og:* 与 twitter:* 的图片必须是绝对地址，微信/Twitter/Facebook 都不解析相对路径 -->
    <meta property="og:url" content="__SITE_URL__" />
    <meta property="og:image" content="__SITE_URL__og-cover.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__SITE_URL__og-cover.jpg" />

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />

    <!--
      启动动画只需要预热海报图（as="image" 是有效的，实测 22ms 就发出请求）。
      不要给视频写 rel="preload" as="video"：Chromium 不认这个 as 值，
      会在控制台报 "uses an unsupported `as` value"，而且请求根本不会发出。
      更坑的是这里会指向 intro.mp4，而浏览器实际优先选的是更小的 intro.webm，
      等于对着一个用不上的文件做无用功。视频由 <video preload="auto"> 自己拉。
    -->
    <link rel="preload" as="image" href="./intro-poster.jpg" />

    <style>
      html,
      body {
        margin: 0;
        background: #fafafb;
      }
      html[data-phase='site'] body {
        background: #0a0a0f;
      }
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
