name: 上线自检

# 三个平台（Vercel / Cloudflare Pages / GitHub Pages）的域名各不相同，
# 逐个点开浏览器看太慢。这个工作流在每次推送后自动 curl 一遍，
# 把 HTTP 状态、标题、canonical、og 标签打进 Actions 日志。
#
# 定位是「体检报告」而不是「守门员」：地址探测不到只给警告、不标红，
# 免得别人看你仓库的提交历史时全是红叉。真需要卡门禁再改成 exit 1。
#
# ── 为什么要额外发 ::notice:: 注解 ──────────────────────────────
# Actions 的日志下载接口 `/actions/jobs/{id}/logs` **需要鉴权**（匿名访问 403），
# 所以「把结果打进日志」并不能被外部程序读到。
# 而 check-runs 的 **annotations 接口是公开可读的**（公开仓库匿名可取），
# 注解于是等价于「不需要令牌的日志」。
#
# 注意：GitHub 每个步骤只保留 **10 条 notice + 10 条 warning**，超出的会被丢掉。
# 所以这里**每个地址只发 1 条 notice**，多字段挤在同一行里。

on:
  workflow_dispatch:
    inputs:
      urls:
        description: '要检查的地址（空格分隔）。留空则检查默认三个平台。'
        required: false
        default: ''
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 逐个探测线上地址
        env:
          INPUT_URLS: ${{ github.event.inputs.urls || '' }}
        run: |
          set -u

          DEFAULT_URLS="https://mpc-gogogo.vercel.app/ https://mpc-gogogo.pages.dev/ https://wangyaowei2333333.github.io/MPC-GOGOGO/"
          URLS="$INPUT_URLS"
          if [ -z "$URLS" ]; then URLS="$DEFAULT_URLS"; fi

          for url in $URLS; do
            echo "=================================================="
            echo "目标: $url"

            code=""
            for attempt in 1 2 3 4 5 6; do
              # 失败时 curl 会往 stdout 写 000（所以不能再 `|| echo 000`，会拼成 000000）；
              # 这里用 `|| code=000` 覆盖赋值，兜住「curl 什么都没输出就挂掉」的情况。
              code=$(curl -sSL -o /tmp/page.html -w '%{http_code}' --max-time 30 "$url" 2>/dev/null) || code=000
              if [ "$code" = "200" ]; then break; fi
              echo "  第 $attempt 次尝试: HTTP $code —— 30 秒后重试（首次部署可能还在构建）"
              sleep 30
            done

            echo "最终 HTTP: $code"

            if [ "$code" != "200" ]; then
              echo "::warning::$url 返回 $code"
              continue
            fi

            # 注解是单行文本，换行会把命令截断，所以统一去掉 \n \r
            host=$(echo "$url" | sed 's#^https\?://##; s#/.*$##')
            title=$(grep -o '<title>[^<]*</title>' /tmp/page.html | head -1 | sed 's/<[^>]*>//g' | tr -d '\n\r')
            canonical=$(grep -o 'rel="canonical"[^>]*href="[^"]*"' /tmp/page.html | head -1 | sed 's/.*href="//; s/"$//' | tr -d '\n\r')
            ogurl=$(grep -o 'og:url" content="[^"]*"' /tmp/page.html | head -1 | sed 's/.*content="//; s/"$//' | tr -d '\n\r')
            ogimg=$(grep -o 'og:image" content="[^"]*"' /tmp/page.html | head -1 | sed 's/.*content="//; s/"$//' | tr -d '\n\r')
            placeholders=$(grep -c '__SITE_URL__' /tmp/page.html || true)

            echo "字节数   : $(wc -c < /tmp/page.html)"
            echo "标题     : $title"
            echo "canonical: $canonical"
            echo "og:url   : $ogurl"
            echo "og:image : $ogimg"
            echo "占位残留 : $placeholders 处"

            # 一行装下全部关键信息，方便匿名读注解的程序直接解析
            echo "::notice title=$host::HTTP $code | 标题=$title | canonical=$canonical | og:url=$ogurl | og:image=$ogimg | 占位残留=$placeholders"

            if [ "$placeholders" != "0" ]; then
              echo "::warning::$url 里仍有未替换的 __SITE_URL__ 占位"
            fi
          done

          echo "=================================================="
          echo "自检结束。"
